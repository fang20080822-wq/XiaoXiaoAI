services:
  - type: web
    name: xiaoxiaai-scientist
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/fang20080822-wq/XiaoXiaoAI
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xiaoxia-scientist-learning-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-flash

databases:
  - name: xiaoxia-scientist-learning-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
